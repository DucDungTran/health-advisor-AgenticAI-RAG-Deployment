services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile.api-ui
    image: health-advisor
    command: ["chainlit", "run", "chatbot.py", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    env_file: .env

  api:
    build:
      context: .
      dockerfile: Dockerfile.api-ui
    image: health-advisor
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "9000"]
    ports: ["9000:9000"]
    env_file: .env